name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# un deploy a la vez: si se mergean dos seguidos, el segundo espera
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    uses: joaquin-rossi/joaco-k8s/.github/workflows/deploy-image.yaml@master
    with:
      app: www-joaquinrossi-net
    secrets: inherit
